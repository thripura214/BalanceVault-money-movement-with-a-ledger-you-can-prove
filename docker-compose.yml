version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: balancevault-postgres
    restart: always
    environment:
      POSTGRES_USER: balancevault_app
      POSTGRES_PASSWORD: vaultpass123
      POSTGRES_DB: balancevault
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: balancevault-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
